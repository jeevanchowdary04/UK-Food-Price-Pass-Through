name: populate-research-repository

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/repo_text_only.tar.gz.b64'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand prepared research repository
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/repo_text_only.tar.gz.b64 > /tmp/repo_text_only.tar.gz
          rm -rf /tmp/research_repo
          mkdir -p /tmp/research_repo
          tar -xzf /tmp/repo_text_only.tar.gz -C /tmp/research_repo
          rsync -a --delete --exclude='.git' /tmp/research_repo/ ./
          # The installation token cannot push workflow-file changes.
          # CI is added separately after this one-time repository population step.
          rm -f .github/workflows/ci.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Validate environment
        run: python scripts/00_validate_environment.py

      - name: Reproduce full statistical analysis
        run: python scripts/03_reproduce_final_analysis.py

      - name: Generate dissertation figures
        run: python scripts/04_make_figures.py

      - name: Verify dissertation headline results
        run: python scripts/05_verify_reported_results.py

      - name: Run research-integrity tests
        run: pytest -q

      - name: Commit completed research repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Populate complete technical research repository"
            git push origin main
          fi
